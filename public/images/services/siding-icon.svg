<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Siding profile panel with realistic 3D lap siding lines -->
  <rect x="20" y="20" width="80" height="80" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Siding planks overlapping with shadows -->
  <!-- Plank 1 -->
  <path d="M22 22H98V38H22V22Z" fill="#38BDF8" fill-opacity="0.3"/>
  <line x1="20" y1="38" x2="100" y2="38" stroke="#0284C7" stroke-width="3"/>
  <line x1="20" y1="40" x2="100" y2="40" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Plank 2 -->
  <path d="M22 40H98V58H22V40Z" fill="#38BDF8" fill-opacity="0.2"/>
  <line x1="20" y1="58" x2="100" y2="58" stroke="#0284C7" stroke-width="3"/>
  <line x1="20" y1="60" x2="100" y2="60" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Plank 3 -->
  <path d="M22 60H98V78H22V60Z" fill="#38BDF8" fill-opacity="0.25"/>
  <line x1="20" y1="78" x2="100" y2="78" stroke="#0284C7" stroke-width="3"/>
  <line x1="20" y1="80" x2="100" y2="80" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Plank 4 -->
  <path d="M22 80H98V98H22V80Z" fill="#38BDF8" fill-opacity="0.15"/>
</svg>
