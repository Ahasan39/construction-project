  <!-- Horizontal transoms -->
  <line x1="31" y1="58" x2="89" y2="58" stroke="#0F2231" stroke-width="3"/>
  <line x1="31" y1="76" x2="89" y2="76" stroke="#0F2231" stroke-width="3"/>

  <!-- Glass shine reflection highlights -->
